name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean Unused Packages and Markdown Lines
        run: rm -rf app/src/main/java/com/uts/simulator/data app/src/main/java/com/uts/simulator/domain app/src/main/java/com/uts/simulator/ui && sed -i '/^```/d' app/src/main/java/com/uts/simulator/MainActivity.kt && sed -i '/^### Part/d' app/src/main/java/com/uts/simulator/MainActivity.kt

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Tournament-Simulator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
